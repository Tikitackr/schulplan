<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stundenplan</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --rand: #8883; --leise: #8887; }
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0 auto;
         padding: 1rem 1rem 3rem; max-width: 34rem; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; }
  h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .05em;
       margin: 1.6rem 0 .4rem; opacity: .55; }
  .zeile { display: flex; gap: .6rem; padding: .4rem 0;
           border-bottom: 1px solid var(--rand); }
  /* nowrap plus feste Breite: Ohne das bricht "07:45\u201309:05" auf zwei
     Zeilen und jede Stunde wird doppelt so hoch. */
  .zeit { flex: 0 0 6.4rem; white-space: nowrap; font-size: .92em;
          font-variant-numeric: tabular-nums; opacity: .75; }
  .raum { margin-left: auto; padding-left: .5rem; opacity: .55; }
  .aus { text-decoration: line-through; opacity: .5; }
  /* Ausfall und Vertretung werden beide benannt, nicht nur gezeichnet: Eine
     durchgestrichene Stunde allein erklaert sich nicht. Der Vermerk steht
     bewusst in einem eigenen Feld, sonst liefe die Durchstreichung mit. */
  .vermerk { opacity: .55; font-size: .9em; }
  /* Ohne Aufzaehlungszeichen: Der Farbpunkt ist der Marker. Beides zusammen
     sind zwei Marker in derselben Zeile. */
  ul { margin: 0; padding: 0; list-style: none; }
  /* Zwei Spalten: Markierung und Text. Ohne das faellt die zweite Zeile
     eines langen Eintrags unter den Punkt zurueck statt eingerueckt zu
     bleiben. */
  li { display: flex; gap: .45em; padding: .15rem 0; }
  /* Der Punkt traegt immer einen duennen Rand. Ohne ihn verschwindet
     ausgerechnet die schwarze Mappe auf dunklem Grund. */
  .punkt { flex: 0 0 auto; width: .72em; height: .72em; border-radius: 50%;
           border: 1px solid var(--leise); margin-top: .42em; }
  /* Eintraege ohne Farbe (Hefte, Zirkel, Sportzeug) halten dieselbe Spalte,
     sonst stuende die Liste treppenfoermig. */
  .punkt.leer { border-color: transparent; }
  details { margin-top: 1.6rem; }
  details > *:not(summary) { margin-top: .4rem; }
  summary { font-size: .95rem; text-transform: uppercase; letter-spacing: .05em;
            opacity: .55; cursor: pointer; }
  nav { display: flex; gap: .6rem; margin-top: 2rem; }
  button { flex: 1; padding: .8rem; font: inherit; border: 1px solid var(--rand);
           border-radius: .7rem; background: transparent; color: inherit;
           cursor: pointer; }
  button[disabled] { opacity: .35; cursor: default; }
  .hinweis { padding: 1rem; border: 1px solid var(--rand); border-radius: .7rem; }
  .stand { margin-top: 1.5rem; font-size: .85rem; opacity: .5; }
  /* Steht direkt unter dem Datum und gehoert optisch dazu, deshalb der
     negative Abstand nach oben. Leise: Es ist eine Randnotiz, keine Aufgabe. */
  .ferien { margin: -.7rem 0 1.2rem; font-size: .9rem; opacity: .55; }
</style>
</head>
<body>
<div id="inhalt"><p class="hinweis">Wird geladen …</p></div>
<script>
  // Bricht das Modul ab (etwa weil Browser-Zwischenspeicher eine alte
  // seite.js liefert), passiert sonst nichts weiter und "Wird geladen …"
  // bleibt fuer immer stehen. Das sieht aus wie ein langsames Netz, ist aber
  // ein Fehler. Diese Notbremse laeuft ohne Modul, also auch dann.
  setTimeout(function () {
    var inhalt = document.getElementById('inhalt');
    if (inhalt && inhalt.dataset.fertig !== 'ja') {
      inhalt.innerHTML = '<p class="hinweis">'
        + 'Die Seite konnte nicht vollständig geladen werden. Bitte neu laden.'
        + ' Bleibt es dabei, hilft es, die Seite ganz zu schließen und erneut'
        + ' zu öffnen.</p>';
    }
  }, 5000);
</script>
<script type="module">
// Die Kennung hinter dem Fragezeichen MUSS bei jeder Aenderung an seite.js
// hochgezaehlt werden. Ohne sie kann ein Geraet die neue Seite mit einer
// alten, zwischengespeicherten seite.js mischen; dann fehlen der Seite
// Funktionen, das Skript bricht ab und es bleibt bei "Wird geladen ...".
import { quelleAusFragment, waehleTag, standText, packEintrag, packText, stundenTitel, ferienText } from './seite.js?v=2';

// Beide Sonderfaelle werden benannt, in derselben Sprache.
const VERMERK = { cancelled: '(fällt aus)', substitution: '(Vertretung)' };

const inhalt = document.getElementById('inhalt');

function hinweis(text) {
  // Auch ein Hinweis ist eine Antwort: Die Notbremse braucht nicht mehr zu
  // greifen, die Seite hat ja etwas zu sagen.
  inhalt.dataset.fertig = 'ja';
  inhalt.replaceChildren();
  const p = document.createElement('p');
  p.className = 'hinweis';
  p.textContent = text;
  inhalt.appendChild(p);
}

const quelle = quelleAusFragment(location.hash);
if (!quelle) {
  hinweis('Dieser Seite fehlt die Adresse der Datenquelle. Sie steht im Link hinter dem Rautezeichen. Ohne sie kann die Seite nichts anzeigen.');
} else {
  starten(quelle);
}

async function starten(quelle) {
  let daten;
  try {
    const antwort = await fetch(quelle, { cache: 'no-store' });
    if (!antwort.ok) throw new Error('Antwort ' + antwort.status);
    daten = await antwort.json();
  } catch (e) {
    // Ein stiller leerer Tag saehe aus wie schulfrei. Deshalb der Grund.
    hinweis('Die Daten sind nicht erreichbar (' + e.message + '). Ohne Netz kann die Seite nichts anzeigen.');
    return;
  }
  let tag = waehleTag(daten.days, new Date());
  if (!tag) {
    hinweis('In den Daten steht kein einziger Tag mit Unterricht.');
    return;
  }
  const tage = (daten.days || []).map(d => d.date).sort();
  const zeichnen = () => malen(daten, tage, tag, richtung => {
    const i = tage.indexOf(tag) + richtung;
    if (i >= 0 && i < tage.length) { tag = tage[i]; zeichnen(); }
  });
  zeichnen();
}

function el(art, klasse, text) {
  const e = document.createElement(art);
  if (klasse) e.className = klasse;
  if (text !== undefined) e.textContent = text;
  return e;
}

function malen(daten, tage, datum, blaettern) {
  const tag = daten.days.find(d => d.date === datum) || { lessons: [], packliste: [] };
  inhalt.replaceChildren();
  inhalt.dataset.fertig = 'ja';

  inhalt.appendChild(el('h1', null, new Date(datum + 'T12:00:00')
    .toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })));

  // Direkt unter dem Datum, weil er sich darauf bezieht. Fehlt er, gibt es
  // die Zeile nicht - kein Platzhalter, keine Luecke.
  const ferien = ferienText(tag);
  if (ferien) inhalt.appendChild(el('p', 'ferien', ferien));

  // Die Packliste steht oben: Sie ist der Zweck der Seite. Der Stundenplan
  // ist ihre Begruendung, nicht die Hauptsache.
  inhalt.appendChild(el('h2', null, 'Einpacken'));
  const stuecke = (tag.packliste || []).map(packEintrag).filter(Boolean);
  if (stuecke.length === 0) {
    inhalt.appendChild(el('p', null, 'Nichts Besonderes.'));
  } else {
    const liste = el('ul');
    for (const stueck of stuecke) {
      const zeile = el('li');
      const punkt = el('span', stueck.farbe ? 'punkt' : 'punkt leer');
      if (stueck.farbe) punkt.style.background = stueck.farbe;
      zeile.appendChild(punkt);
      zeile.appendChild(el('span', null, packText(stueck)));
      liste.appendChild(zeile);
    }
    inhalt.appendChild(liste);
  }

  // Beide Klappen stehen zu (ausdruecklicher Wunsch, 29.08.2026). Die
  // Packliste steht darueber offen da, und die ist der Zweck der Seite.
  if (tag.lessons.length === 0) {
    inhalt.appendChild(el('h2', null, 'Stundenplan'));
    inhalt.appendChild(el('p', null, 'Kein Unterricht.'));
  } else {
    const klappe = el('details');
    klappe.appendChild(el('summary', null, stundenTitel(tag)));
    for (const s of tag.lessons) {
      const zeile = el('div', 'zeile');
      zeile.appendChild(el('span', 'zeit', s.start + '–' + s.end));
      zeile.appendChild(el('span', s.status === 'cancelled' ? 'aus' : null, s.subject));
      const vermerk = VERMERK[s.status];
      if (vermerk) zeile.appendChild(el('span', 'vermerk', vermerk));
      if (s.room) zeile.appendChild(el('span', 'raum', s.room));
      klappe.appendChild(zeile);
    }
    inhalt.appendChild(klappe);
  }

  const offen = (daten.homework || [])
    .filter(a => !a.completed && a.due >= datum)
    .sort((a, b) => a.due.localeCompare(b.due));
  // Zugeklappt, mit der Anzahl im Titel: Fuenf Aufgaben mit vollem Text sind
  // der halbe Bildschirm. Das Signal entsteht aus der Zahl, ohne Deko.
  if (offen.length === 0) {
    inhalt.appendChild(el('h2', null, 'Hausaufgaben'));
    inhalt.appendChild(el('p', null, 'Keine offenen Aufgaben.'));
  } else {
    const klappe = el('details');
    klappe.appendChild(el('summary', null, 'Hausaufgaben (' + offen.length + ')'));
    for (const a of offen) {
      const zeile = el('div', 'zeile');
      zeile.appendChild(el('span', 'zeit', 'bis ' + a.due.slice(8) + '.' + a.due.slice(5, 7) + '.'));
      zeile.appendChild(el('span', null, (a.subject ? a.subject + ': ' : '') + a.text));
      klappe.appendChild(zeile);
    }
    inhalt.appendChild(klappe);
  }

  const i = tage.indexOf(datum);
  const nav = el('nav');
  const zurueck = el('button', null, '← Vorheriger Tag');
  const vor = el('button', null, 'Nächster Tag →');
  zurueck.disabled = i <= 0;
  vor.disabled = i < 0 || i >= tage.length - 1;
  zurueck.onclick = () => blaettern(-1);
  vor.onclick = () => blaettern(1);
  nav.append(zurueck, vor);
  inhalt.appendChild(nav);

  const stand = standText(daten.generated);
  if (stand) inhalt.appendChild(el('p', 'stand', 'Stand: ' + stand));
}
</script>
</body>
</html>
